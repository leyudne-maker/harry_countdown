<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleeps Until July 19!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .countdown-number {
            font-size: 12rem; /* Made the number even bigger and bolder */
            font-weight: 800;
            background: linear-gradient(45deg, #ff7b72, #a5d6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0px 4px 30px rgba(165, 214, 255, 0.2));
        }

        .label {
            font-size: 2rem; /* Bigger, simpler text for a kid */
            font-weight: 600;
            letter-spacing: 1px;
            color: #8b949e;
        }
        /* This automatically adjusts the size when opened on a phone */
        @media (max-width: 600px) {
            .countdown-number {
                font-size: 7rem; /* Safely shrinks the giant number for small screens */
        }
        .label {
            font-size: 1.5rem;
        }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="countdown-number" id="days-box">--</div>
        <div class="label" id="label-box">Days to go!</div>
    </div>

    <script>
        // Target date: Midnight of July 19, 2026
        const targetDate = new Date('July 19, 2026 00:00:00').getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            // If we reach or pass the day
            if (difference <= 0) {
                document.getElementById('days-box').innerText = "🎉";
                document.getElementById('label-box').innerText = "It's Time!";
                return;
            }

            // Math.ceil rounds up to the next whole day.
            // This means on July 18th at any time, it will calculate as 0.something days, and round up to "1".
            const daysLeft = Math.ceil(difference / (1000 * 60 * 60 * 24));

            document.getElementById('days-box').innerText = daysLeft;
        }

        // Run right away
        updateTimer();

        // Check every 60 seconds instead of every second, since the number only changes at midnight
        setInterval(updateTimer, 60000);
    </script>
</body>
</html>
